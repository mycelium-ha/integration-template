name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: mycelium-ha/.github/.github/workflows/ha-validate.yml@chore/ha-standards
    with:
      hacs_category: integration
      run_mypy: true
      run_pytest: true
      pytest_args: --cov
