# Integration Quality Scale tracking:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# Status: done | todo | exempt (exempt and todo need a `comment`).
# "done" below means the template already satisfies the rule; keep it true as you build.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The template registers no actions.
  appropriate-polling:
    status: todo
    comment: Pick an interval that fits the device (const.DEFAULT_SCAN_INTERVAL).
  brands:
    status: todo
    comment: Add icon/logo images to the brand/ folder.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The template registers no actions.
  docs-high-level-description: todo
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator based and subscribe through CoordinatorEntity.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The template registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The template has no options flow.
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The template device needs no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry represents exactly one device.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry represents exactly one device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
